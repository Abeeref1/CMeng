name: CMeng Railway Persistence Seed

on:
  push:
    branches: [main]
    paths:
      - "scripts/railway-persistence-smoke.mjs"
      - ".github/workflows/railway-persistence-seed.yml"
      - ".github/workflows/railway-persistence-verify.yml"

permissions:
  contents: read

jobs:
  seed-volume-project:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Seed persisted project after exact Railway release is live
        env:
          CMENG_RAILWAY_URL: https://cmeng-main-production.up.railway.app
          EXPECTED_SHA: ${{ github.sha }}
          PERSISTENCE_PROJECT_ID: PERSISTENCE-SMOKE-VOLUME
          PERSISTENCE_MODE: seed
        run: node scripts/railway-persistence-smoke.mjs
