name: Batch C failure diagnosis (temporary branch-only)
on:
  push:
    branches: ['fix/batch-c-overdue-start-acceptance']
    paths: ['.github/workflows/batch-c-diagnostics-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  summarize-failure:
    if: github.ref == 'refs/heads/fix/batch-c-overdue-start-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract only failing-test contexts from the prior full test run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://api.github.com/repos/Abeeref1/CMeng/actions/jobs/109762154615/logs', {headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
          if(!response.ok)throw new Error(`Log retrieval ${response.status}`);
          const lines=(await response.text()).split('\n');
          for(let i=0;i<lines.length;i++)if(/not ok \d+ -/.test(lines[i]))console.log(lines.slice(Math.max(0,i-2),Math.min(lines.length,i+42)).join('\n'));
          JS
