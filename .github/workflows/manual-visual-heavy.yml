name: CMeng Heavy Visual Audit
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  capture-heavy:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CMENG_RAILWAY_URL: https://cmeng-main-production.up.railway.app
      CMENG_EXPECTED_RELEASE: 02f1fa3c23aed92724fc053f7c016df5dcd7b11f
      CMENG_AUDIT_SHARD: ${{ matrix.shard }}
      CMENG_AUDIT_SHARD_COUNT: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Capture heavy live pages by viewport scrolling
        run: python scripts/railway-visual-audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-heavy-visual-audit-shard-${{ matrix.shard }}
          path: visual-audit
          retention-days: 7
