name: CMeng Final Regression

# Full regression of one exact candidate: every test file, split across parallel jobs.
# Test files, assertions, project counts and the tests' own timeouts are not changed.
on:
  push:
    branches: ['verifier/cmeng-final-ci-20261019']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: Suite ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: shard-1, kind: shard, shard: '0'}
          - {id: shard-2, kind: shard, shard: '1'}
          - {id: shard-3, kind: shard, shard: '2'}
          - {id: shard-4, kind: shard, shard: '3'}
          - {id: shard-5, kind: shard, shard: '4'}
          - {id: shard-6, kind: shard, shard: '5'}
          - {id: shard-7, kind: shard, shard: '6'}
          - {id: shard-8, kind: shard, shard: '7'}
          - {id: boq-raster, kind: file, file: boq-raster-recovery.test.js, pattern: ''}
          - {id: j8-final-100, kind: file, file: j8-final-blind-release-acceptance.test.js, pattern: ''}
          - {id: j8-manifest, kind: file, file: j8-feature-batch-blind-acceptance.test.js, pattern: '^J8 feature-batch manifest '}
          - {id: j8-F1, kind: file, file: j8-feature-batch-blind-acceptance.test.js, pattern: '^J8 F1-MANAGEMENT '}
          - {id: j8-F2, kind: file, file: j8-feature-batch-blind-acceptance.test.js, pattern: '^J8 F2-PROGRAMME-PLANNING '}
          - {id: j8-F3, kind: file, file: j8-feature-batch-blind-acceptance.test.js, pattern: '^J8 F3-PROGRESS-RESOURCES '}
          - {id: j8-F4, kind: file, file: j8-feature-batch-blind-acceptance.test.js, pattern: '^J8 F4-FORECAST-RECOVERY '}
          - {id: j8-F5, kind: file, file: j8-feature-batch-blind-acceptance.test.js, pattern: '^J8 F5-DELAY-CLAIMS '}
          - {id: j8-F6, kind: file, file: j8-feature-batch-blind-acceptance.test.js, pattern: '^J8 F6-COMMERCIAL '}
          - {id: j8-F7, kind: file, file: j8-feature-batch-blind-acceptance.test.js, pattern: '^J8 F7-DELIVERY '}
          - {id: j8-F8, kind: file, file: j8-feature-batch-blind-acceptance.test.js, pattern: '^J8 F8 platform '}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Runner hardware
        run: |
          echo "nproc=$(nproc)"; free -m; node -v; git rev-parse HEAD
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact candidate
        run: npm run build
      - name: Run ${{ matrix.id }}
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
          SHARD: ${{ matrix.shard }}
          FILE: ${{ matrix.file }}
          PATTERN: ${{ matrix.pattern }}
        run: |
          set +e
          if [ "$KIND" = shard ]; then
            files=$(ls dist/tests/*.test.js | grep -v '/j8-' | grep -v 'boq-raster-recovery' | sort | awk -v s="$SHARD" '(NR-1)%8==s')
            echo "files: $(echo $files | wc -w)"
            node --test --test-concurrency=1 --test-reporter=tap $files > result.tap 2>&1; code=$?
          else
            args=(--test --test-concurrency=1 --test-reporter=tap)
            if [ -n "$PATTERN" ]; then args+=("--test-name-pattern=$PATTERN"); fi
            node "${args[@]}" "dist/tests/$FILE" > result.tap 2>&1; code=$?
          fi
          grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms)' result.tap | tail -9
          grep -E '^not ok' result.tap | head -40 || true
          echo "exit_code=$code"
          exit $code
      - name: Keep TAP output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-${{ matrix.id }}
          path: result.tap
