name: CMeng T11 Cold Dashboard Diagnostic

on:
  push:
    branches: ['fix/cmeng-resume-t11-20261016']
    paths:
      - 'packages/**'
      - 'scripts/release-latency.cjs'
      - '.github/workflows/cmeng-t11-cold-diagnostic.yml'

permissions:
  contents: read

# Diagnostics may be superseded by newer source; the original six-group
# workflow remains mandatory and unchanged for release certification.
concurrency:
  group: cmeng-t11-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-dashboard:
    name: Unchanged four-cold-project 5000ms
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build application and assembled browser
        run: npm run build
      - name: Check unchanged release benchmark
        shell: bash
        env:
          CMENG_LATENCY_RESULT: /tmp/cmeng-t11/cold-dashboard.json
        run: |
          set -o pipefail
          mkdir -p /tmp/cmeng-t11
          node scripts/release-latency.cjs 2>&1 | tee /tmp/cmeng-t11/latency.log
      - name: Preserve exact source and measured failure or pass
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/cmeng-t11
          git rev-parse HEAD > /tmp/cmeng-t11/exact-source-sha.txt
          printf '%s\n' 'This supplemental diagnostic neither changes nor replaces any of the original six mandatory groups.' > /tmp/cmeng-t11/scope.txt
      - name: Retain the raw unchanged-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmeng-t11-unchanged-cold-${{ github.sha }}
          path: /tmp/cmeng-t11
          retention-days: 7
