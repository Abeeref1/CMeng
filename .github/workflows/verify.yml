name: CMeng Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cmeng-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck and adversarial tests
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/cmeng-verify.log

      - name: Record tested source identity
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/cmeng-verification
          git rev-parse HEAD > /tmp/cmeng-verification/source-commit.txt
          git ls-files -z > /tmp/cmeng-tracked-files
          tar --null -T /tmp/cmeng-tracked-files -czf /tmp/cmeng-verification/cmeng-source.tgz
          cp /tmp/cmeng-verify.log /tmp/cmeng-verification/verify.log 2>/dev/null || true
          cd /tmp/cmeng-verification
          sha256sum cmeng-source.tgz > source-sha256.txt

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmeng-verification-${{ github.run_id }}
          path: /tmp/cmeng-verification/
          retention-days: 7


  live-production-acceptance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CMENG_RAILWAY_URL: https://cmeng-main-production.up.railway.app
      CMENG_EXPECTED_RELEASE: c3c2e252149b878bba7ac51e7a81f496cf51f0ec
    steps:
      - name: Checkout exact acceptance source
        uses: actions/checkout@v4
        with:
          ref: c3c2e252149b878bba7ac51e7a81f496cf51f0ec
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Diagnose live SCH01 refresh state safely
        shell: bash
        run: |
          node <<'NODE'
          const base=process.env.CMENG_RAILWAY_URL;
          const j=async p=>{const r=await fetch(base+p);if(!r.ok)throw new Error(p+":"+r.status);return r.json()};
          const portfolio=await j("/api/portfolio");
          let candidates=portfolio.projects.filter(p=>/ORBIT/i.test(p.projectId));
          if(!candidates.length&&portfolio.projects.length===1)candidates=portfolio.projects;
          if(candidates.length!==1)throw new Error("acceptance project not unique");
          const prefix="/api/projects/"+encodeURIComponent(candidates[0].projectId);
          const [near,docs,overview]=await Promise.all([
            j(prefix+"/schedule/modules/near-critical"),
            j(prefix+"/evidence/documents"),
            j(prefix+"/overview")
          ]);
          const basis=docs.documents.filter(d=>d.documentType==="schedule_control_basis").map(d=>({
            basisState:d.basisState,mediaType:d.mediaType,parserState:d.parserState,familyKey:d.familyKey,
            diagnosticCodes:d.diagnostics,
            assertionMetrics:(d.assertions||[]).map(a=>({metric:a.metric,valueType:a.valueType,unit:a.unit,value:a.value}))
          }));
          console.log(JSON.stringify({
            overview:{version:overview.version,latestDataDateIso:overview.latestDataDateIso},
            near:{
              thresholdBasis:near.data?.thresholdBasis,
              nearCriticalThresholdWorkingDays:near.data?.nearCriticalThresholdWorkingDays,
              nearCriticalThresholdHours:near.data?.nearCriticalThresholdHours,
              nearCriticalCount:near.data?.nearCriticalCount,
              classificationCoveragePercent:near.data?.classificationCoveragePercent
            },
            basis
          },null,2));
          NODE
      - name: Trace all 29 live Project Control pages against governed results
        run: node scripts/railway-accuracy-acceptance.mjs
      - name: Install isolated browser acceptance tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Trace all 29 live pages in the browser without writes
        run: python scripts/railway-browser-acceptance.py
