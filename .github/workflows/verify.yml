name: CMeng Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cmeng-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck and adversarial tests
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/cmeng-verify.log

      - name: Record tested source identity
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/cmeng-verification
          git rev-parse HEAD > /tmp/cmeng-verification/source-commit.txt
          git ls-files -z > /tmp/cmeng-tracked-files
          tar --null -T /tmp/cmeng-tracked-files -czf /tmp/cmeng-verification/cmeng-source.tgz
          cp /tmp/cmeng-verify.log /tmp/cmeng-verification/verify.log 2>/dev/null || true
          cd /tmp/cmeng-verification
          sha256sum cmeng-source.tgz > source-sha256.txt

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmeng-verification-${{ github.run_id }}
          path: /tmp/cmeng-verification/
          retention-days: 7
