name: CMeng Verify

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cmeng-verify-${{ github.ref }}-${{ github.sha }}
  # During active engineering, verify the newest candidate only. Superseded
  # commits keep any evidence already produced, but they must not delay the
  # exact current head. Test scope, assertions and thresholds are unchanged.
  cancel-in-progress: false

jobs:
  gates:
    name: Verify ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gate: [regression, raster, acceptance, independent, operations]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build exact candidate
        run: npm run build

      - name: Check assembled browser before any release gate
        run: node scripts/check-assembled-browser.cjs

      - name: Run complete verification group
        shell: bash
        env:
          CMENG_GATE: ${{ matrix.gate }}
          CMENG_BLIND_EVIDENCE_DIR: /tmp/cmeng-verification/blind-inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/cmeng-verification
          run_gate() {
            case "$CMENG_GATE" in
              regression)
                npm run typecheck
                node --check scripts/cmeng-all-project-root-gate.mjs
                node --check scripts/cmeng-all-project-screen-acceptance.mjs
                node scripts/run-unit-tests.cjs regression
                ;;
              raster)
                node scripts/run-unit-tests.cjs raster
                ;;
              acceptance)
                node scripts/run-unit-tests.cjs acceptance
                ;;
              independent)
                evidence=/tmp/cmeng-verification/independent
                python3 scripts/independent-cpm-reference.py "$evidence/cpm"
                node scripts/compare-independent-cpm.cjs "$evidence/cpm"
                python3 scripts/independent-mixed-calendar-reference.py "$evidence/mixed-calendar"
                node scripts/compare-independent-cpm.cjs "$evidence/mixed-calendar"
                python3 scripts/independent-mixed-calendar-lag-reference.py "$evidence/mixed-calendar-lag"
                node scripts/compare-independent-cpm.cjs "$evidence/mixed-calendar-lag"
                python3 scripts/independent-commercial-notice-reference.py "$evidence/commercial-notice"
                node scripts/compare-independent-commercial-notice.cjs "$evidence/commercial-notice"
                python3 scripts/independent-ledger-delivery-reference.py "$evidence/ledger-delivery"
                node scripts/compare-independent-ledger-delivery.cjs "$evidence/ledger-delivery"
                python3 scripts/independent-cash-flow-reference.py "$evidence/cash-flow"
                node scripts/compare-independent-cash-flow.cjs "$evidence/cash-flow"
                python3 scripts/independent-delivery-lifecycle-reference.py "$evidence/delivery-lifecycle"
                node scripts/compare-independent-delivery-lifecycle.cjs "$evidence/delivery-lifecycle"
                node scripts/fresh-restore-verification.cjs "$evidence/restore"
                ;;
              operations)
                # Measure all three unchanged hard gates even if one fails.
                # The overall operations group still fails when ANY gate fails.
                operations_failed=0
                CMENG_LATENCY_RESULT=/tmp/cmeng-verification/cold-dashboard.json npm run test:release:latency || operations_failed=1
                CMENG_DURABILITY_RESULT=/tmp/cmeng-verification/upload-durability.json node --max-old-space-size=3072 scripts/upload-durability-scale.cjs || operations_failed=1
                CMENG_DELIVERY_PROFILE=/tmp/cmeng-verification/delivery.cpuprofile CMENG_DELIVERY_BENCHMARK_OUTPUT=/tmp/cmeng-verification/delivery-latency.json node scripts/delivery-latency.cjs || operations_failed=1
                if [ "$operations_failed" -ne 0 ]; then echo "One or more unchanged operations release thresholds failed"; return 1; fi
                ;;
              *) echo "Unknown verification group: $CMENG_GATE"; return 1 ;;
            esac
          }
          run_gate 2>&1 | tee /tmp/cmeng-verify.log

      - name: Record tested source identity
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/cmeng-verification
          git rev-parse HEAD > /tmp/cmeng-verification/source-commit.txt
          git ls-files -z > /tmp/cmeng-tracked-files
          tar --null -T /tmp/cmeng-tracked-files -czf /tmp/cmeng-verification/cmeng-source.tgz
          cp /tmp/cmeng-verify.log /tmp/cmeng-verification/verify.log 2>/dev/null || true
          cd /tmp/cmeng-verification
          sha256sum cmeng-source.tgz > source-sha256.txt

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmeng-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.gate }}
          path: /tmp/cmeng-verification/
          retention-days: 7

  # Preserve the required "verify" check: it cannot pass on a failed, skipped or
  # cancelled group. Independent groups have separate runners, not fewer tests.
  verify:
    name: verify
    needs: [gates]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification group
        env:
          GROUP_RESULT: ${{ needs.gates.result }}
        run: |
          test "$GROUP_RESULT" = "success"
