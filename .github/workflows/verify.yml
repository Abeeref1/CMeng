name: CMeng Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cmeng-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck and adversarial tests
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/cmeng-verify.log

      - name: Record tested source identity
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/cmeng-verification
          git rev-parse HEAD > /tmp/cmeng-verification/source-commit.txt
          git ls-files -z > /tmp/cmeng-tracked-files
          tar --null -T /tmp/cmeng-tracked-files -czf /tmp/cmeng-verification/cmeng-source.tgz
          cp /tmp/cmeng-verify.log /tmp/cmeng-verification/verify.log 2>/dev/null || true
          cd /tmp/cmeng-verification
          sha256sum cmeng-source.tgz > source-sha256.txt

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmeng-verification-${{ github.run_id }}
          path: /tmp/cmeng-verification/
          retention-days: 7

      - name: Install browser for manual live audit
        if: always()
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Capture all live pages and visible figures
        if: always()
        env:
          CMENG_RAILWAY_URL: https://cmeng-main-production.up.railway.app
          CMENG_EXPECTED_RELEASE: b978af587b5380a2083c28d0287d8e69a7cb8d76
        run: python scripts/manual-live-page-audit.py

      - name: Preserve live page audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmeng-live-page-audit-${{ github.run_id }}
          path: live-page-audit/
          retention-days: 7
