name: CMeng Variance Viewport Audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python scripts/variance-viewport.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-variance-viewport
          path: variance-audit
          retention-days: 7
