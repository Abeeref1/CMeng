name: Batch B-C focused acceptance (temporary branch-only)
on:
  push:
    branches: ['fix/batch-c-overdue-start-acceptance']
    paths: ['.github/workflows/batch-bc-acceptance-once.yml']
permissions:
  contents: write
concurrency:
  group: cmeng-batch-bc-focused-only
  cancel-in-progress: false
jobs:
  near-critical-repair:
    if: github.ref == 'refs/heads/fix/batch-c-overdue-start-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/batch-c-overdue-start-acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Reproduce hidden authority before repair
        shell: bash
        run: |
          set +e
          node --test dist/tests/batch-c-near-critical-visibility.test.js > /tmp/batch-c-near-before.log 2>&1
          result=$?
          set -e
          grep -E '^(not ok|# tests|# pass|# fail)' /tmp/batch-c-near-before.log || true
          test "$result" -ne 0
      - name: Restore visible authority without changing float calculations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/runtime-api/src/ui.ts')
          text=p.read_text()
          def once(old,new):
              global text
              assert text.count(old)==1,old[:150]
              text=text.replace(old,new,1)
          once("'+coverageHeadline+managementControl+", "'+coverageHeadline+basis+managementControl+")
          once("'+kpis+basis+exceptionsPanel+reconciliation+floatConcentrationWarning+distributionSummary(p.floatDistribution", "'+kpis+exceptionsPanel+reconciliation+floatConcentrationWarning+distributionSummary(p.floatDistribution")
          lines=text.splitlines(keepends=True)
          matches=[i for i,line in enumerate(lines) if line.startswith('  const coverageHeadline=') and 'Float classification coverage:' in line]
          assert len(matches)==1
          lines[matches[0]]='''  const classificationComplete=unresolved===0&&p.classificationCoveragePercent===100;
            const coverageMessage=classificationComplete?"The execution population is fully classifiable against the disclosed float rules.":unresolved>0?fmt(unresolved)+" execution activities still lack the float/calendar evidence required for complete classification. Known critical/negative-float rows remain useful, but they are not presented as the whole-project total.":"Project-wide classification is not established. Available source-float rows remain useful; they are not presented as a complete project population.";
            const coverageHeadline='<div class="notice '+(classificationComplete?"info":"warn")+'"><b>Float classification coverage: '+escapeHtml(p.classificationCoveragePercent===null||p.classificationCoveragePercent===undefined?"Not established":fmt(p.classificationCoveragePercent)+"%")+'</b><p>'+escapeHtml(coverageMessage)+'</p></div>';
          '''
          p.write_text(''.join(lines))
          PY
      - name: Verify all tests without skips
        shell: bash
        run: |
          set +e
          npm run verify > /tmp/batch-c-near-verify.log 2>&1
          result=$?
          set -e
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/batch-c-near-verify.log').read_text().splitlines()
          for i,line in enumerate(lines):
              if line.startswith('not ok '):print('\n'.join(lines[max(0,i-1):i+30]))
          print('\n'.join(lines[-12:]))
          PY
          exit "$result"
      - name: Verify scale remains protected
        run: npm run test:stress > /tmp/batch-c-near-stress.log 2>&1 || { tail -80 /tmp/batch-c-near-stress.log; exit 1; }
      - name: Commit verified visibility repair to branch only
        run: |
          git diff --check
          git add packages/runtime-api/src/ui.ts
          git config user.name 'CMeng acceptance checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep near-critical authority visible and qualify unestablished coverage'
          git push origin HEAD:fix/batch-c-overdue-start-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-c-near-${{ github.run_id }}
          path: /tmp/batch-c-near-*.log
          retention-days: 7
  batch-b-live-page-first:
    if: github.ref == 'refs/heads/fix/batch-c-overdue-start-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Check every Batch B page across all real projects with ORBIT last
        env:
          CMENG_EXPECTED_RELEASE: a5f85338565ce4e0bcdb669bb72c0c20a2842db3
          CMENG_MIN_PROJECTS: '19'
        run: python scripts/railway-management-batch-b-acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-b-page-first-${{ github.run_id }}
          path: batch-b-acceptance/
          retention-days: 7
