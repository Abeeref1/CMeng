name: CMeng Fast Pages 13-17
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 13-progress-position
            key: progress-report
          - label: 14-variance-trend
            key: variance-trends
          - label: 15-progress-s-curve
            key: progress-scurve
          - label: 16-installed-quantities
            key: quantity-scurve
          - label: 17-wbs-progress
            key: progress-breakdown
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CMENG_RAILWAY_URL: https://cmeng-main-production.up.railway.app
      CMENG_EXPECTED_RELEASE: 8c54f83af79e4e6818ba4d1195cb66d32be9a258
      CMENG_PAGE_LABEL: ${{ matrix.label }}
      CMENG_PAGE_KEY: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python scripts/railway-one-page-capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-${{ matrix.label }}
          path: audit-page
          retention-days: 7
