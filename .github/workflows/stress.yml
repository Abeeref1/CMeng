name: CMeng Parser Stress

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/stress.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "tests/**"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: cmeng-parser-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Large schedule and BOQ stress tests
        run: npm run test:stress
