name: CMeng Railway Accuracy Acceptance
on:
  workflow_run:
    workflows: [CMeng Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmeng-production-accuracy
  cancel-in-progress: true
jobs:
  read-only-production:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # A healthy full production acceptance is currently about 29 minutes.
    # Keep headroom so successful page-first acceptance is not cancelled by the job cap.
    timeout-minutes: 90
    env:
      CMENG_RAILWAY_URL: https://cmeng-main-production.up.railway.app
      CMENG_EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
      CMENG_MIN_PROJECTS: '19'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify exact release, canonical runtime, reports and source preservation
        run: node scripts/railway-system-acceptance.mjs
      - name: Install isolated browser test tools
        if: always()
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify live module navigation and report window without writes
        run: python scripts/railway-browser-acceptance.py
      - name: Verify every live page across all projects, page-first, ORBIT last
        run: node scripts/railway-full-page-acceptance.mjs
      - name: Verify every Batch B management page across all projects, ORBIT last
        env:
          CMENG_MIN_PROJECTS: '19'
        run: python scripts/railway-management-batch-b-acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-production-accuracy-${{ github.run_id }}
          path: |
            system-acceptance.json
            browser-acceptance.json
            full-page-acceptance.json
            batch-b-acceptance/
          retention-days: 7
