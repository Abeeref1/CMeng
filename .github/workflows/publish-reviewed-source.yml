name: Publish Reviewed CMeng Source
on:
  push:
    branches: [fix/accuracy-foundation-reconciled-20260920]
    paths: [.github/workflows/publish-reviewed-source.yml]
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source checksum and apply
        shell: python
        run: |
          import re, base64, gzip, hashlib, subprocess
          from pathlib import Path
          workflow = Path('.github/workflows/apply-accuracy-corrections.yml').read_text()
          data = re.search(r"data = '''(.*?)'''", workflow, re.S).group(1)
          repairs = [('dიო','dio'),('SEo2U2mPC','SEo2mPC'),('Hocee59g','Ho59g'),('h5aYYraa','h5aYraa'),('sqX7bXwpyFc','sqX7xpyFc')]
          for old, new in repairs:
              data = data.replace(old, new)
          patch = gzip.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd81c0b013c5df153669516f62ca72767f6a4517f8acb342ceab004922a3d362c', 'Source checksum mismatch: refusing changes'
          Path('/tmp/accuracy.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/accuracy.patch'], check=True)
          subprocess.run(['git','apply','/tmp/accuracy.patch'], check=True)
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck and all regression tests
        env:
          CMENG_TEST_MODE: '1'
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/accuracy-tests.log
          npm run test:stress 2>&1 | tee /tmp/accuracy-stress.log
      - name: Publish only tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/runtime-api/src/canonical-time-claims.ts packages/runtime-api/src/commercial-canonical.ts packages/runtime-api/src/payment-reconciliation.ts tests/canonical-source-integration.test.ts scripts/railway-accuracy-acceptance.mjs .github/workflows/railway-accuracy-acceptance.yml
          git rm .github/workflows/apply-accuracy-corrections.yml .github/workflows/publish-reviewed-source.yml
          git diff --cached --check
          git commit -m 'fix: reconcile payment evidence and EOT positions at the programme cutoff'
          git push origin HEAD:refs/heads/fix/accuracy-foundation-reconciled-20260920
          git rev-parse HEAD > /tmp/accuracy-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-reviewed-source-verification
          path: |
            /tmp/accuracy-tests.log
            /tmp/accuracy-stress.log
            /tmp/accuracy-source-sha.txt
            .github/workflows/apply-accuracy-corrections.yml
          retention-days: 7
