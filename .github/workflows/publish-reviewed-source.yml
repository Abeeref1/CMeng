name: Publish Reviewed CMeng Source
on:
  push:
    branches: [fix/accuracy-foundation-reconciled-20260920]
    paths: [.github/workflows/publish-reviewed-source.yml]
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source checksum and apply application changes
        shell: python
        run: |
          import re, base64, gzip, hashlib, subprocess
          from pathlib import Path
          workflow = Path('.github/workflows/apply-accuracy-corrections.yml').read_text()
          data = re.search(r"data = '''(.*?)'''", workflow, re.S).group(1)
          repairs = [('dიო','dio'),('SEo2U2mPC','SEo2mPC'),('Hocee59g','Ho59g'),('h5aYYraa','h5aYraa'),('sqX7bXwpyFc','sqX7xpyFc')]
          for old, new in repairs:
              data = data.replace(old, new)
          patch = gzip.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd81c0b013c5df153669516f62ca72767f6a4517f8acb342ceab004922a3d362c', 'Source checksum mismatch: refusing changes'
          Path('/tmp/accuracy.patch').write_bytes(patch)
          # Workflow installation is a separate authorized repository write.
          # Preserve the acceptance workflow that already exists on this branch.
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--check','/tmp/accuracy.patch'], check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','/tmp/accuracy.patch'], check=True)
      - name: Connect payment evidence reconciliation to the existing view
        shell: python
        run: |
          from pathlib import Path
          p = Path('packages/runtime-api/src/ui.ts')
          s = p.read_text()
          replacements = [
            ('["Payment receipts",rows.filter(r=>r.amounts.paidAmount.value!==null).length,"explicit paid amounts only"]', '["Recorded paid amounts",rows.filter(r=>r.amounts.paidAmount.value!==null).length,"source figures, not verified receipt count"],["Reconciled balances",rows.filter(r=>r.calculatedOutstandingAmount?.state==="official").length,"dated, governed cash allocations"]'),
            ('This check covers the four reported components only. Omitted tax and other deductions remain unknown.', 'Gross work plus variations less retention, advance recovery and other deductions. All required components and money bases must be explicit; tax is added only for an evidenced exclusive-to-inclusive transition.')
          ]
          for old, new in replacements:
              assert s.count(old) == 1, 'Unexpected payment view structure'
              s = s.replace(old, new, 1)
          anchor = '  } else if(key==="commercial-variations"){'
          assert s.count(anchor) == 1, 'Unexpected commercial view structure'
          addition = '    content+=panel("Cash allocation and balance reconciliation","Reported outstanding is retained unchanged. A calculated balance requires a dated, approved cumulative receipt allocated to this certificate on or before the Data Date.",table(["Certificate","Payment as of","Payment reference","Reported outstanding","Calculated outstanding","Balance state","Diagnostics","Evidence"],rows.map(r=>[escapeHtml(r.paymentId),period(r.paymentDate),escapeHtml(r.paymentReference||"Not provided"),amount(r.amounts.outstandingAmount),amount(r.calculatedOutstandingAmount),escapeHtml(humanizeKey(r.calculatedOutstandingAmount?.state||"missing")),escapeHtml((r.diagnostics||[]).map(humanizeKey).join("; ")||"No conflict in the checked fields"),evidence(r.calculatedOutstandingAmount?.receipts||[])])));\n'
          p.write_text(s.replace(anchor, addition + anchor, 1))
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck and all regression tests
        env:
          CMENG_TEST_MODE: '1'
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/accuracy-tests.log
          npm run test:stress 2>&1 | tee /tmp/accuracy-stress.log
      - name: Publish tested application source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/runtime-api/src/canonical-time-claims.ts packages/runtime-api/src/commercial-canonical.ts packages/runtime-api/src/payment-reconciliation.ts packages/runtime-api/src/ui.ts tests/canonical-source-integration.test.ts scripts/railway-accuracy-acceptance.mjs
          git diff --cached --check
          git commit -m 'fix: reconcile payment evidence and cutoff EOT in canonical runtime and views'
          git push origin HEAD:refs/heads/fix/accuracy-foundation-reconciled-20260920
          git rev-parse HEAD > /tmp/accuracy-source-sha.txt
          git ls-files -z | tar --null -T - -czf /tmp/accuracy-source.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-reviewed-source-verification-${{ github.run_id }}
          path: |
            /tmp/accuracy-tests.log
            /tmp/accuracy-stress.log
            /tmp/accuracy-source-sha.txt
            /tmp/accuracy-source.tgz
          retention-days: 7
