name: CMeng M14 latency probe
# Diagnostic only: the unchanged release speed gate, repeated on one runner
# with different worker young-generation sizes, to compare like with like.
on:
  push:
    branches: ['fix/**']
    paths: ['.github/workflows/cmeng-m14-latency-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Repeat the speed gate
        shell: bash
        run: |
          set +e
          nproc
          for round in 1 2 3; do
            CMENG_LATENCY_RESULT=/tmp/lat-$round.json node scripts/release-latency.cjs > /tmp/lat-$round.log 2>&1
            node -e "const d=require('/tmp/lat-$round.json');console.log('round $round passed',d.passed,'cold',Math.round(d.priorColdGate.coldRequestMs),'upload',Math.round(d.uploadToReadyMs),'first',Math.round(d.firstDashboardMs),'shapes',d.coldProjectShapes.profiles.map(r=>Math.round(r.durationMs)).join(' '),'answers',d.dashboardAnswerEvents.map(e=>Math.round(e.totalMs)).join(' '),'workers',d.workerReadyEvents.slice(-4).map(e=>e.ms).join(' '))"
          done
