name: CMeng Human Review Capture
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CMENG_RAILWAY_URL: https://cmeng-main-production.up.railway.app
      CMENG_EXPECTED_RELEASE: 8c54f83af79e4e6818ba4d1195cb66d32be9a258
      CMENG_AUDIT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Capture live pages
        run: python scripts/railway-human-review-capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-human-review-shard-${{ matrix.shard }}
          path: visual-audit-shard-${{ matrix.shard }}
          retention-days: 7
