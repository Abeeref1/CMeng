name: CMeng speed bisect (temporary)
on:
  push:
    branches: [perf/bisect-20261027]
jobs:
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sha: [bd851eccb764c99d2ad89afcddd729e0048d4492,b354c59677fb86af974ebd2ed54ff7fc9191c469,ae359263f8f28bbc19b8d6a24385bf414b0a5fe1,540fa919777e3bccb3ad5c1bbd721aa17dda1cd0,09e78a539d460e95b46fe1b56cbc492efe0f916b,00dc33919102d30760416b0c0503d4fbcdbbda7b,3de16d6a79bfa52db752e09386408d148055e67d,9ce6882264a6b602d30c857608eed634eade6255,7c5501f75a5031ff58a43c81b73a8c1b529db558,5da3be8f4da660c13f7cedbe33098d934475847e,5ec4187c09ca1c248957e4824b4d9a6613fa1f97,0c7862aa00365ac478ac0f3d9a1e045f8b8e2fcc,e55facaabfa8ffe07813041ea0704a1f47ef8345,d35da977ed4baa2929017fba57c46ef2960e3763]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Release latency, three runs
        run: |
          for k in 1 2 3; do
            CMENG_LATENCY_RESULT=/tmp/lat-$k.json node scripts/release-latency.cjs > /tmp/lat-$k.log 2>&1 || true
            node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/lat-$k.json','utf8'));const c=d.coldProjectShapes||{};console.log('RESULT ${{ matrix.sha }} run $k coldShapesMax='+Math.round(c.maxProjectMs)+' wall='+Math.round(c.wallMs)+' priorCold='+Math.round(d.priorColdGate.coldRequestMs)+' firstDash='+Math.round(d.firstDashboardMs)+' uploadToReady='+Math.round(d.uploadToReadyMs)+' passed='+d.passed)" || tail -20 /tmp/lat-$k.log
          done
