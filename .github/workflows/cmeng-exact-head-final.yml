name: CMeng Exact Head Final Gate
on:
  push:
    branches: ['fix/cmeng-open-items-20261011']
permissions:
  contents: read
jobs:
  gates:
    name: Final ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gate: [regression, raster, concurrency, acceptance, independent, operations]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/check-assembled-browser.cjs
      - name: Run unchanged gate
        shell: bash
        env:
          CMENG_GATE: ${{ matrix.gate }}
          CMENG_BLIND_EVIDENCE_DIR: /tmp/cmeng-final/blind-inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/cmeng-final
          case "$CMENG_GATE" in
            regression)
              npm run typecheck
              node --check scripts/cmeng-all-project-root-gate.mjs
              node --check scripts/cmeng-all-project-screen-acceptance.mjs
              node scripts/run-unit-tests.cjs regression
              ;;
            raster)
              node scripts/run-unit-tests.cjs raster
              ;;
            concurrency)
              node scripts/run-unit-tests.cjs concurrency
              ;;
            acceptance)
              node scripts/run-unit-tests.cjs acceptance
              ;;
            independent)
              evidence=/tmp/cmeng-final/independent
              python3 scripts/independent-cpm-reference.py "$evidence/cpm"
              node scripts/compare-independent-cpm.cjs "$evidence/cpm"
              python3 scripts/independent-mixed-calendar-reference.py "$evidence/mixed-calendar"
              node scripts/compare-independent-cpm.cjs "$evidence/mixed-calendar"
              python3 scripts/independent-mixed-calendar-lag-reference.py "$evidence/mixed-calendar-lag"
              node scripts/compare-independent-cpm.cjs "$evidence/mixed-calendar-lag"
              python3 scripts/independent-commercial-notice-reference.py "$evidence/commercial-notice"
              node scripts/compare-independent-commercial-notice.cjs "$evidence/commercial-notice"
              python3 scripts/independent-ledger-delivery-reference.py "$evidence/ledger-delivery"
              node scripts/compare-independent-ledger-delivery.cjs "$evidence/ledger-delivery"
              python3 scripts/independent-cash-flow-reference.py "$evidence/cash-flow"
              node scripts/compare-independent-cash-flow.cjs "$evidence/cash-flow"
              python3 scripts/independent-delivery-lifecycle-reference.py "$evidence/delivery-lifecycle"
              node scripts/compare-independent-delivery-lifecycle.cjs "$evidence/delivery-lifecycle"
              node scripts/fresh-restore-verification.cjs "$evidence/restore"
              ;;
            operations)
              failed=0
              CMENG_LATENCY_RESULT=/tmp/cmeng-final/cold-dashboard.json npm run test:release:latency || failed=1
              CMENG_DURABILITY_RESULT=/tmp/cmeng-final/upload-durability.json node --max-old-space-size=3072 scripts/upload-durability-scale.cjs || failed=1
              CMENG_DELIVERY_PROFILE=/tmp/cmeng-final/delivery.cpuprofile CMENG_DELIVERY_BENCHMARK_OUTPUT=/tmp/cmeng-final/delivery-latency.json node scripts/delivery-latency.cjs || failed=1
              test "$failed" -eq 0
              ;;
          esac
      - name: Save exact source identity
        if: always()
        run: git rev-parse HEAD > /tmp/cmeng-final/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-final-${{ github.run_id }}-${{ matrix.gate }}
          path: /tmp/cmeng-final/
          retention-days: 7
  final:
    name: final
    needs: [gates]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.gates.result }}" = success
