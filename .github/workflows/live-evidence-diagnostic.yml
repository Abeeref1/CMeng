name: CMeng Live Evidence Diagnostic
on:
  push:
    branches:
      - fix/system-quality-after-six-project-audit-20260925
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live evidence metadata
        env:
          BASE: https://cmeng-main-production.up.railway.app
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, re
          base=os.environ["BASE"].rstrip("/")
          def get(path):
              with urllib.request.urlopen(base+path,timeout=120) as r:
                  return json.load(r)
          def compact_doc(d):
              rr=d.get("readReview") or {}
              mp=d.get("mapping") or {}
              headers=d.get("schemaHeaders") or []
              date_like=[h for h in headers if re.search(r"date|time|raised|issued|submitted|approval|approved|due|period|as of|start|finish|closed|opened|notice|determination",str(h),re.I)]
              return {
                  "sourceFilename":d.get("sourceFilename"),
                  "documentType":d.get("documentType"),
                  "basisState":d.get("basisState"),
                  "schemaHeaders":headers,
                  "dateLikeHeaders":date_like,
                  "readReview":{"state":rr.get("state"),"note":rr.get("note")},
                  "mapping":{"state":mp.get("state"),"message":mp.get("message"),"rowCount":mp.get("rowCount")}
              }
          dmm=get("/api/projects/DMM-HDC-P2/evidence/documents")
          bad=[]
          for d in dmm.get("documents",[]):
              txt=json.dumps({"readReview":d.get("readReview"),"mapping":d.get("mapping")},default=str)
              if re.search(r"date|unresolved|unread|unrecogn|missing|no usable|column",txt,re.I):
                  cd=compact_doc(d)
                  if cd["readReview"]["state"]!="resolved" or re.search(r"date",str(cd["readReview"]["note"]),re.I):
                      bad.append(cd)
          print("DMM_DATE_DIAGNOSTIC="+json.dumps(bad,ensure_ascii=False))
          for key in ["near-critical","independent-forecast"]:
              body=get("/api/projects/QA-P1-WADI-20260924/schedule/modules/"+key)
              data=body.get("data") or {}
              print("QA_P1_"+key.replace("-","_").upper()+"="+json.dumps({
                  "status":body.get("status"),
                  "reason":body.get("reason"),
                  "calendarBasisReview":data.get("calendarBasisReview"),
                  "unresolvedActivityCount":data.get("unresolvedActivityCount"),
                  "managementReviewReason":data.get("managementReviewReason"),
              },ensure_ascii=False))
          portfolio=get("/api/portfolio")
          result=[]
          for p in portfolio.get("projects",[]):
              pid=p["projectId"]
              body=get("/api/projects/"+urllib.parse.quote(pid,safe="")+"/schedule/modules/independent-forecast")
              d=body.get("data") or {}
              sp=d.get("sourceProductivityForecast") or {}
              result.append({
                  "projectId":pid,
                  "sourceProductivityForecast":{
                      "state":sp.get("state"),
                      "method":sp.get("method"),
                      "coveragePercent":sp.get("coveragePercent"),
                      "workPackageCount":sp.get("workPackageCount"),
                      "sourceRefCount":len(sp.get("sourceRefs") or [])
                  },
                  "status":body.get("status"),
                  "reason":body.get("reason")
              })
          print("PRODUCTIVITY_FORECASTS="+json.dumps(result,ensure_ascii=False))
          PY
