name: CMeng Shared Rules Fast Release
on:
  push:
    branches: ['fix/cmeng-shared-rules-20261010']
    paths: ['scripts/cmeng-shared-patch.*', '.github/workflows/cmeng-shared-fast.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checked shared-rule patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cmeng-shared-evidence
          cat scripts/cmeng-shared-patch.1 scripts/cmeng-shared-patch.2 scripts/cmeng-shared-patch.3 | base64 -d | gzip -d > /tmp/cmeng-shared.patch
          echo '74b002331ae1e6e36e57e9197ce5e33d2e9ade2a5aba66bf5d431ff0ce8d3e3e  /tmp/cmeng-shared.patch' | sha256sum -c -
          git apply --check /tmp/cmeng-shared.patch
          git apply /tmp/cmeng-shared.patch
      - name: Install application and browser dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
      - name: Mandatory build and browser contract
        run: |
          npm run build
          npm run typecheck
          node scripts/check-assembled-browser.cjs
          node --test dist/tests/system-shared-rules.test.js dist/tests/accountability-unassigned.test.js dist/tests/consultant-response-paging.test.js dist/tests/fact-provenance-paging.test.js dist/tests/procurement-float-consistency.test.js dist/tests/system-root-causes.test.js dist/tests/delivery-authority.test.js | tee /tmp/cmeng-shared-evidence/targeted.log
      - name: Capture largest source report read-only
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const r=await fetch('https://cmeng-main-production.up.railway.app/api/projects/UPTOWN-100/management/master-dashboard/report.json',{signal:AbortSignal.timeout(180000)});
            if(!r.ok)throw Error('Largest source report HTTP '+r.status);
            const data=await r.json(),value=data.result??data;
            if((value.data?.projectFacts?.projectId??value.data?.projectId)!=='UPTOWN-100')throw Error('Largest source identity mismatch');
            fs.writeFileSync('/tmp/cmeng-shared-evidence/largest-dashboard.json',JSON.stringify(data));
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Every demo page and largest dashboard in Chromium
        shell: bash
        run: |
          set -euo pipefail
          export CMENG_CHROMIUM="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CMENG_CHROMIUM" ]; then
            npx playwright install chromium
            export CMENG_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          fi
          CMENG_LARGEST_REPORT=/tmp/cmeng-shared-evidence/largest-dashboard.json CMENG_REQUIRE_LARGEST=1 CMENG_FAST_GATE_REPORT=/tmp/cmeng-shared-evidence/fast-gate.json node scripts/fast-release-gate.cjs
      - name: Publish only the source that passed every fast gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages tests
          git commit -m 'Shared rules: full-population facts, source action identity, typed presentation, cash/resource evidence and ownership after full fast gate'
          git push origin HEAD:refs/heads/fix/cmeng-validated-shared-rules-20261010
          git rev-parse HEAD > /tmp/cmeng-shared-evidence/validated-commit.txt
          git rev-parse HEAD^{tree} > /tmp/cmeng-shared-evidence/validated-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-shared-fast-${{ github.run_id }}
          path: /tmp/cmeng-shared-evidence/
          retention-days: 1
