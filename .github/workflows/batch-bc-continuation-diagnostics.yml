name: Batch B-C continuation diagnostics (branch only)
on:
  push:
    branches: [fix/batch-c-overdue-start-acceptance]
    paths: [.github/workflows/batch-bc-continuation-diagnostics.yml]
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove the specific defects before changing code
        shell: bash
        run: |
          set -o pipefail
          mkdir -p continuation-evidence
          git rev-parse HEAD > continuation-evidence/source-before.txt
          npm run build
          set +e
          node --test dist/tests/batch-b-live-failures.test.js > continuation-evidence/red-before.log 2>&1
          result=$?
          set -e
          cat continuation-evidence/red-before.log
          test "$result" -ne 0
          grep -E 'not ok.*valid sparse Accountability' continuation-evidence/red-before.log
          grep -E 'not ok.*added duplicate source rows' continuation-evidence/red-before.log
      - name: Correct shared response handling and certify like-for-like populations
        shell: python
        run: |
          from pathlib import Path
          def replace(path,before,after):
              p=Path(path);s=p.read_text()
              assert s.count(before)==1,(path,'expected patch context missing or ambiguous')
              p.write_text(s.replace(before,after))
          replace('packages/runtime-api/src/ui.ts',
            'if((d.legacyKey||d.key)===key&&d.status==="blocked"&&(d.issueAssessment||d.data?.projectionKey==="delivery")){',
            'if(e.status===409&&(d.legacyKey||d.key)===key&&d.status==="blocked"&&(d.issueAssessment||(Array.isArray(d.dependencies)&&d.data&&typeof d.data==="object"&&!Array.isArray(d.data)&&typeof d.data.projectionKey==="string"))){')
          replace('tests/ui-management-experience.test.ts',
            "Object.assign(new Error('Unavailable'),{data:blocked})",
            "Object.assign(new Error('Unavailable'),{status:409,data:blocked})")
          replace('packages/runtime-api/src/projection-integrity.ts',
            """      // Identity matching is intentionally keyed by governed activity identity.
                // A source programme may contain duplicate activity IDs; those remain a
                // source-data defect elsewhere and must not be misreported here as a
                // CMeng arithmetic failure. Source-row population is certified separately.
                const uniqueCurrentActivityIds=new Set(model.activities.map(activity=>activity.activityId)).size;
                compare('current_activity_partition',uniqueCurrentActivityIds,data.matchedActivityCount+data.addedActivityCount);""".replace('\n      ','\n'),
            """      // Matched activities use distinct identity pairs, while added activities
                // retain every supplied source row (including duplicate IDs). Compare
                // identities with identities and source rows with source rows; neither
                // drop duplicate evidence nor conceal a genuinely missing/extra row.
                const currentIds=new Set(model.activities.map(activity=>activity.activityId));
                const addedIds=new Set<string>(rows.filter((row:any)=>row.changeKind==='added').map((row:any)=>row.activityId));
                const addedSourceRowCount=model.activities.filter(activity=>addedIds.has(activity.activityId)).length;
                const matchedSourceRowCount=model.activities.length-addedSourceRowCount;
                compare('current_activity_partition',currentIds.size,data.matchedActivityCount+addedIds.size);
                compare('added_identity_membership',[...addedIds].every(id=>currentIds.has(id)),true);
                compare('added_source_population',data.addedActivityCount,addedSourceRowCount);
                compare('current_source_row_partition',model.activities.length,matchedSourceRowCount+data.addedActivityCount);""".replace('\n      ','\n'))
      - name: Full regression verification
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee continuation-evidence/verify.log
          npm run test:stress 2>&1 | tee continuation-evidence/scale.log
          git diff --check
          git diff > continuation-evidence/repair.patch
      - name: Commit verified repairs only when this branch has not changed
        shell: bash
        run: |
          test "$(git ls-remote origin refs/heads/fix/batch-c-overdue-start-acceptance | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/runtime-api/src/ui.ts packages/runtime-api/src/projection-integrity.ts tests/ui-management-experience.test.ts
          git commit -m 'Fix sparse Accountability rendering and source-row identity reconciliation'
          git push origin HEAD:refs/heads/fix/batch-c-overdue-start-acceptance
          git rev-parse HEAD > continuation-evidence/source-after.txt
          git archive --format=tar.gz HEAD > continuation-evidence/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-bc-repair-${{ github.run_id }}
          path: continuation-evidence/
          retention-days: 7
