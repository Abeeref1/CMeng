name: CMeng Source Candidate Safety and Browser Gate
on:
  push:
    branches: ['fix/cmeng-ai-link-candidates-20261011']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed patch preserving newer linking work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cmeng-candidate-evidence
          cat scripts/cmeng-ai-candidate-patch.1 scripts/cmeng-ai-candidate-patch.2 scripts/cmeng-ai-candidate-patch.3 | base64 -d | xz -d > /tmp/cmeng-candidate-evidence/changes.patch
          echo '1fb5159ff7bbe1a8687ce2b49ce3712f000b2ca1d9b998c30654a9e6b05b6dd1  /tmp/cmeng-candidate-evidence/changes.patch' | sha256sum -c -
          git apply --check /tmp/cmeng-candidate-evidence/changes.patch
          git apply /tmp/cmeng-candidate-evidence/changes.patch
          python - <<'PY'
          from pathlib import Path
          path=Path('packages/runtime-api/src/project-state.ts')
          source=path.read_text()
          old="""        scheduleAuthorityVersion: 'explicit-adoption-v1',
        version: 1,
"""
          new="""        scheduleAuthorityVersion: 'explicit-adoption-v1',
        sourceIntegrationVersion: 'canonical-source-v7',
        version: 1,
"""
          if old not in source:
              raise SystemExit('fresh-project source integration initializer not found')
          path.write_text(source.replace(old,new,1))
          PY
      - name: Install application and browser dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
      - name: Build, types and assembled browser syntax
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/cmeng-candidate-evidence/build.log
          npm run typecheck
          node scripts/check-assembled-browser.cjs
      - name: Source proposal safety, explicit review, persistence and budget tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 dist/tests/link-candidate-core.test.js dist/tests/link-candidate-runtime.test.js dist/tests/usage-budget.test.js dist/tests/evidence-semantic-ai.test.js dist/tests/shared-decision-closure.test.js dist/tests/project-gateway-preservation.test.js dist/tests/module-issue-classification.test.js dist/tests/progress-breakdown-area-binding.test.js dist/tests/management-constraint-brief.test.js dist/tests/payment-component-reconciliation.test.js dist/tests/project-read-cache.test.js 2>&1 | tee /tmp/cmeng-candidate-evidence/targeted-tests.log
      - name: Read largest existing dashboard without changing project records
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const response=await fetch('https://cmeng-main-production.up.railway.app/api/projects/UPTOWN-100/management/master-dashboard/report.json',{signal:AbortSignal.timeout(120000)});
            if(!response.ok)throw Error('Largest dashboard source HTTP '+response.status);
            const report=await response.json(),value=report.result??report;
            if((value.data?.projectFacts?.projectId??value.data?.projectId)!=='UPTOWN-100')throw Error('Largest dashboard identity differs');
            fs.writeFileSync('/tmp/cmeng-candidate-evidence/largest-dashboard.json',JSON.stringify(report));
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Browser start, every demo page, largest dashboard and matching entry
        shell: bash
        run: |
          set -euo pipefail
          export CMENG_CHROMIUM="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CMENG_CHROMIUM" ]; then npx playwright install chromium; export CMENG_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')"; fi
          CMENG_LARGEST_REPORT=/tmp/cmeng-candidate-evidence/largest-dashboard.json CMENG_REQUIRE_LARGEST=1 CMENG_FAST_GATE_REPORT=/tmp/cmeng-candidate-evidence/fast-browser.json node scripts/fast-release-gate.cjs
      - name: Record unchanged five-second performance result separately
        shell: bash
        run: |
          CMENG_LATENCY_RESULT=/tmp/cmeng-candidate-evidence/cold-dashboard.json node scripts/release-latency.cjs > /tmp/cmeng-candidate-evidence/performance.log 2>&1 && echo PASS > /tmp/cmeng-candidate-evidence/performance-status.txt || echo FAIL > /tmp/cmeng-candidate-evidence/performance-status.txt
          cat /tmp/cmeng-candidate-evidence/performance-status.txt
          echo 'Performance failures remain open. Full Verify still requires operations success on the exact candidate.'
      - name: Publish only application source that passed all targeted and browser checks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages tests
          git commit -m 'Source-bound AI link proposals with explicit review, persistent budget and truthful provider status; preserve numeric source authority'
          git push origin HEAD:refs/heads/fix/cmeng-ai-link-candidates-validated-20261011
          git rev-parse HEAD > /tmp/cmeng-candidate-evidence/validated-commit.txt
          git rev-parse HEAD^{tree} > /tmp/cmeng-candidate-evidence/validated-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-ai-candidate-evidence-${{ github.run_id }}
          path: /tmp/cmeng-candidate-evidence/
          retention-days: 7
