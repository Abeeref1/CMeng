name: CMeng Page-First Human Audit
on:
  push:
    branches:
      - audit/page-first-human-six-projects-20260925
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMENG_RAILWAY_URL: https://cmeng-main-production.up.railway.app
      CMENG_EXPECTED_RELEASE: 98025f1deb01334972b3a7263eeb296bfc4c445f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run page-first human audit
        run: python scripts/page-first-human-audit.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmeng-page-first-human-audit-${{ github.run_id }}
          path: human-audit/
          retention-days: 7
