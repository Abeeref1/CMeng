name: CMeng J8 Blind Acceptance

# Runs the two unchanged 100-project J8 blind suites on GitHub-hosted runners.
# Test files, assertions, project counts and the tests' own timeouts are not
# changed. The feature-batch file is split across parallel jobs only by
# selecting each existing top-level test with --test-name-pattern.
on:
  push:
    branches: ['verifier/cmeng-j8-ci-20261019']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  j8:
    name: J8 ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: final-100
            file: j8-final-blind-release-acceptance.test.js
            pattern: ''
          - id: manifest
            file: j8-feature-batch-blind-acceptance.test.js
            pattern: '^J8 feature-batch manifest '
          - id: F1
            file: j8-feature-batch-blind-acceptance.test.js
            pattern: '^J8 F1-MANAGEMENT '
          - id: F2
            file: j8-feature-batch-blind-acceptance.test.js
            pattern: '^J8 F2-PROGRAMME-PLANNING '
          - id: F3
            file: j8-feature-batch-blind-acceptance.test.js
            pattern: '^J8 F3-PROGRESS-RESOURCES '
          - id: F4
            file: j8-feature-batch-blind-acceptance.test.js
            pattern: '^J8 F4-FORECAST-RECOVERY '
          - id: F5
            file: j8-feature-batch-blind-acceptance.test.js
            pattern: '^J8 F5-DELAY-CLAIMS '
          - id: F6
            file: j8-feature-batch-blind-acceptance.test.js
            pattern: '^J8 F6-COMMERCIAL '
          - id: F7
            file: j8-feature-batch-blind-acceptance.test.js
            pattern: '^J8 F7-DELIVERY '
          - id: F8
            file: j8-feature-batch-blind-acceptance.test.js
            pattern: '^J8 F8 platform '
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Runner hardware
        run: |
          echo "nproc=$(nproc)"
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core|Socket)' || true
          free -m
          node -v
          git rev-parse HEAD

      - name: Install dependencies
        run: |
          start=$(date +%s)
          npm ci --ignore-scripts --no-audit --no-fund
          echo "install_seconds=$(( $(date +%s) - start ))"

      - name: Build exact candidate
        run: |
          start=$(date +%s)
          npm run build
          echo "build_seconds=$(( $(date +%s) - start ))"

      - name: Run J8 ${{ matrix.id }}
        shell: bash
        env:
          J8_FILE: ${{ matrix.file }}
          J8_PATTERN: ${{ matrix.pattern }}
        run: |
          set -euo pipefail
          args=(--test --test-concurrency=1 --test-reporter=spec)
          if [ -n "$J8_PATTERN" ]; then args+=("--test-name-pattern=$J8_PATTERN"); fi
          echo "node ${args[*]} dist/tests/$J8_FILE"
          start=$(date +%s)
          set +e
          node "${args[@]}" "dist/tests/$J8_FILE"
          code=$?
          set -e
          echo "test_seconds=$(( $(date +%s) - start )) exit_code=$code"
          exit $code
