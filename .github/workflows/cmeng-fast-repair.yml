name: CMeng Fast Repair Gate
on:
  push:
    branches: ['fix/cmeng-verify-recovery-20261010']
    paths: ['scripts/cmeng-outage-repair.patch', '.github/workflows/cmeng-fast-repair.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed shared patch without changing source records
        run: git apply --check scripts/cmeng-outage-repair.patch && git apply scripts/cmeng-outage-repair.patch
      - name: Install exact application dependencies and browser driver
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright
      - name: Mandatory build, type and assembled browser checks
        run: |
          npm run build
          npm run typecheck
          node scripts/check-assembled-browser.cjs
          node --test dist/tests/fact-provenance-paging.test.js dist/tests/consultant-response-paging.test.js
      - name: Capture largest-project unpaged source output read-only
        run: |
          mkdir -p /tmp/cmeng-fast-evidence
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const response=await fetch('https://cmeng-main-production.up.railway.app/api/projects/UPTOWN-100/management/master-dashboard/report.json',{signal:AbortSignal.timeout(180000)});
            if(!response.ok)throw Error('Largest source report unavailable: HTTP '+response.status);
            const data=await response.json();
            if((data.result?.data?.projectFacts?.projectId??data.result?.data?.projectId)!=='UPTOWN-100')throw Error('Largest source report identity mismatch');
            fs.writeFileSync('/tmp/cmeng-fast-evidence/largest-dashboard.json',JSON.stringify(data));
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Every demo page and largest Master Dashboard in real browser
        run: |
          export CMENG_CHROMIUM="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CMENG_CHROMIUM" ]; then
            npx playwright install chromium
            export CMENG_CHROMIUM="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          fi
          CMENG_LARGEST_REPORT=/tmp/cmeng-fast-evidence/largest-dashboard.json CMENG_REQUIRE_LARGEST=1 CMENG_FAST_GATE_REPORT=/tmp/cmeng-fast-evidence/fast-gate.json node scripts/fast-release-gate.cjs
      - name: Save the exact source that passed the fast gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/runtime-api/src/response-paging.ts packages/runtime-api/src/server.ts scripts/fast-release-gate.cjs tests/fact-provenance-paging.test.ts
          git commit -m 'Repair shared fact-provenance paging and status filters after full fast browser gate'
          git push origin HEAD:refs/heads/fix/cmeng-validated-outage-20261010
          git rev-parse HEAD > /tmp/cmeng-fast-evidence/validated-commit.txt
          git rev-parse HEAD^{tree} > /tmp/cmeng-fast-evidence/validated-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmeng-fast-outage-evidence-${{ github.run_id }}
          path: /tmp/cmeng-fast-evidence/
          retention-days: 1
