name: CMeng Repair Focused Verification

on:
  push:
    branches: ['fix/**']

permissions:
  contents: read

# Additional evidence only: never replaces, skips or weakens the mandatory
# six-group verify workflow, owner guard, or unchanged T11 5,000-ms benchmark.
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact engineering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install complete declared dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build complete source and browser
        run: npm run build
      - name: Run independent repair regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            dist/tests/t11-shared-plan-positions.test.js \
            dist/tests/t11-shared-criticality-pass.test.js \
            dist/tests/t11-near-critical-calendar-index.test.js \
            dist/tests/t11-delivery-workfront-source-scope.test.js \
            dist/tests/source-only-forecast-isolation.test.js \
            dist/tests/t11-scurve-calendar-and-observation-scale.test.js \
            dist/tests/t11-milestone-calendar-join-scale.test.js \
            dist/tests/t11-workfront-identical-source-reuse.test.js \
            dist/tests/t11-wbs-discipline-scale.test.js \
            dist/tests/t11-variance-full-population.test.js \
            dist/tests/lookahead-procurement-linked-readiness.test.js \
            dist/tests/t11-source-completion-base-parity.test.js \
            dist/tests/t11-revision-date-reuse.test.js \
            dist/tests/consultant-response-paging.test.js \
            dist/tests/t05-governed-screen-counts.test.js \
            dist/tests/t05-t09-diagnosis-missing-values.test.js \
            dist/tests/t05-progress-workfront-null-display.test.js
      - name: Assert original owner guard integrity and comparator
        run: node scripts/verify-cmeng-owner-guard.cjs
      - name: Assert complete original T01 defect IDs and evidence requirements
        run: node scripts/verify-cmeng-t01-ledger.cjs
